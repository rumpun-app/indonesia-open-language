services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: open_language
      POSTGRES_USER: open_language
      POSTGRES_PASSWORD: open_language
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres-data:
